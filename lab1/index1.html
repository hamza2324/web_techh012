<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3x3 Table Example</title>
  <style>
    table {
      border-collapse: collapse;   /* merges double borders */
      width: 50%;
      text-align: center;
    }

    th, td {
      border: 2px solid black;     /* adds border to each cell */
      padding: 10px;
    }

    th {
      background-color: lightgray;
    }
  </style>
</head>
<body>

  <h2>3x3 Table Example</h2>

  <table>
    <tr>
      <th>Header 1</th>
      <th>Header 2</th>
      <th>Header 3</th>
    </tr>
    <tr>
      <td>Row 1, Col 1</td>
      <td>Row 1, Col 2</td>
      <td>Row 1, Col 3</td>
    </tr>
    <tr>
      <td>Row 2, Col 1</td>
      <td>Row 2, Col 2</td>
      <td>Row 2, Col 3</td>
    </tr>
  </table>

</body>
</html>
